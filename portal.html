        <meta property="og:type" content="website">
        <meta property="og:title" content="NOVA | Personnel Login">
        <meta property="og:description" content="Exploring new approaches to energy, observation, vacuum science, and advanced technology through innovative research and experimentation.">

        <link rel="canonical" href="https://jfrgplayz.github.io/NOVAcorps/portal.html">

        <title>NOVA | Personnel Login</title>

        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="stylesheet" href="portal.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>

    <body>

        <main id="portal">

            <section id="login-container">

                <div id="portal-logo">
                    <img src="NOVAcorpsLogoWhite.png" alt="NOVA">
                </div>

                <h1>NOVA PERSONNEL PORTAL</h1>

                <p id="portal-subtitle">
                    Authorised personnel access only.
                </p>

                <form id="login-form">

                    <div class="input-group">
                        <label for="employee-id">EMPLOYEE ID</label>

                        <input
                            type="text"
                            id="employee-id"
                            name="employee-id"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="access-code">ACCESS CODE</label>

                        <input
                            type="password"
                            id="access-code"
                            name="access-code"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <button type="submit">
                        SIGN IN
                    </button>

                </form>

                <p id="login-message"></p>

                <a href="index.html" id="return-link">
                    RETURN TO NOVA
                </a>

            </section>

        </main>
        <script src="portal.js"></script>
    </body>
</html>
